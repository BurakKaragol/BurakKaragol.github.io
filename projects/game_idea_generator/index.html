<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Idea Generator | Burak Karagol</title>
    <meta name="description" content="Randomized game design prompt generator combining genres, settings, mechanics, and unique twists." />
    <meta name="keywords" content="Game Design, Game Idea, Randomizer, Game Dev, Creativity, Prompts" />

    <meta name="theme-color" content="#0b1120" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://burakkaragol.github.io/projects/game_idea_generator/" />
    <meta property="og:title" content="Game Idea Generator | Burak Karagol" />
    <meta property="og:description" content="Randomized game design prompt generator combining genres, settings, mechanics, and unique twists." />
    <meta property="og:image" content="https://burakkaragol.github.io/assets/img/projects/game_idea_generator.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://burakkaragol.github.io/projects/game_idea_generator/" />
    <meta name="twitter:title" content="Game Idea Generator | Burak Karagol" />
    <meta name="twitter:description" content="Randomized game design prompt generator combining genres, settings, mechanics, and unique twists." />
    <meta name="twitter:image" content="https://burakkaragol.github.io/assets/img/projects/game_idea_generator.webp" />

    <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/img/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/apple-touch-icon.png" />

    <!-- FontAwesome for icons -->
    <script src="https://kit.fontawesome.com/e10aba78d2.js" crossorigin="anonymous"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Link to external CSS -->
    <link rel="stylesheet" href="./game_idea.css">
</head>
<body class="dark-theme">

    <main id="app-main">
        <section class="game-idea" id="game-idea">
            <div class="game-idea__container" id="game-idea-container">
                <header class="game-idea__header">
                    <h1 class="section__title">Game Idea Generator</h1>
                    <p class="section__subtitle">Get a unique game idea for your next project</p>
                </header>

                <div class="game-idea__box">
                    <!-- Static Titles, Dynamic Content -->
                    <div class="game-idea__section">
                        <div class="section-header">
                            <strong class="section-title">Genre</strong>
                            <i id="genre-lock" class="fa-solid fa-lock-open lock-icon" title="Lock/Unlock Genre"></i>
                        </div>
                        <p class="section-content">
                            <i id="genre-icon" class="fa-solid fa-question-circle"></i>
                            <span id="genre-text">Click generate to roll</span>
                        </p>
                    </div>

                    <div class="game-idea__section">
                        <div class="section-header">
                            <strong class="section-title">Setting</strong>
                            <i id="setting-lock" class="fa-solid fa-lock-open lock-icon" title="Lock/Unlock Setting"></i>
                        </div>
                        <p class="section-content">
                            <i id="setting-icon" class="fa-solid fa-question-circle"></i>
                            <span id="setting-text">Click generate to roll</span>
                        </p>
                    </div>

                    <div class="game-idea__section">
                        <div class="section-header">
                            <strong class="section-title">Mechanic</strong>
                            <i id="mechanic-lock" class="fa-solid fa-lock-open lock-icon" title="Lock/Unlock Mechanic"></i>
                        </div>
                        <p class="section-content">
                            <i id="mechanic-icon" class="fa-solid fa-question-circle"></i>
                            <span id="mechanic-text">Click generate to roll</span>
                        </p>
                    </div>

                    <div class="game-idea__section">
                        <div class="section-header">
                            <strong class="section-title">Twist</strong>
                            <i id="twist-lock" class="fa-solid fa-lock-open lock-icon" title="Lock/Unlock Twist"></i>
                        </div>
                        <p class="section-content">
                            <i id="twist-icon" class="fa-solid fa-question-circle"></i>
                            <span id="twist-text">Click generate to roll</span>
                        </p>
                    </div>

                    <button id="generate-idea-btn" class="game-idea__button">
                        <i class="fa-solid fa-dice"></i> Generate Idea
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- Link to external JS -->
    <script src="./game_idea.js"></script>
</body>
</html>
