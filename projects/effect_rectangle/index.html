<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Effect Rectangle - Camera Recorder | Burak Karagol</title>
    <meta name="description" content="Augmented reality camera framing sandbox using Google MediaPipe hands and WebCodecs MP4 recording." />
    <meta name="keywords" content="Augmented Reality, MediaPipe, WebCodecs, MP4, Computer Vision, Camera Filters" />
    <meta name="author" content="Burak Karagol" />
    <meta name="theme-color" content="#0A1118" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://burakkaragol.github.io/projects/effect_rectangle/" />
    <meta property="og:title" content="AR Effect Rectangle | Burak Karagol" />
    <meta property="og:description" content="Augmented reality camera framing sandbox using Google MediaPipe hands and WebCodecs MP4 recording." />
    <meta property="og:image" content="https://burakkaragol.github.io/assets/img/projects/effect_rectangle.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://burakkaragol.github.io/projects/effect_rectangle/" />
    <meta name="twitter:title" content="AR Effect Rectangle | Burak Karagol" />
    <meta name="twitter:description" content="Augmented reality camera framing sandbox using Google MediaPipe hands and WebCodecs MP4 recording." />
    <meta name="twitter:image" content="https://burakkaragol.github.io/assets/img/projects/effect_rectangle.webp" />

    <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/img/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/apple-touch-icon.png" />

    <!-- FontAwesome for icons -->
    <script src="https://kit.fontawesome.com/e10aba78d2.js" crossorigin="anonymous"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- CSS Links -->
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="./effect_rectangle.css">

    <!-- CDNs for MediaPipe & Mp4Muxer -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer/build/mp4-muxer.js" crossorigin="anonymous"></script>
</head>
<body class="dark-theme">

    <!-- Navigation Header -->
    <header class="app-header">
        <a href="../index.html" class="back-link">
            <i class="fa-solid fa-arrow-left-long"></i>
            <span>Back to Projects</span>
        </a>
        <h1 class="app-title">Effect Rectangle</h1>
    </header>

    <!-- Main Workspace -->
    <main class="app-container">
        <div id="loading" class="loading-overlay">
            <div class="spinner"></div>
            <p>Initializing Camera & AI Hand Model...</p>
            <span class="loading-subtext">Please grant camera permissions when prompted</span>
        </div>

        <div class="workspace">
            <!-- Video & Canvas Section -->
            <div class="canvas-wrapper">
                <video id="videoElement" autoplay playsinline></video>
                <canvas id="canvasElement"></canvas>
                
                <!-- On-screen gesture gesture/state indicators -->
                <div id="gestureIndicator" class="gesture-indicator">
                    <span class="pulse-dot"></span>
                    <span id="activeEffectLabel">Effect: Normal</span>
                </div>
            </div>

            <!-- Dashboard HUD Panel -->
            <aside class="control-panel">
                <div class="panel-section">
                    <h2><i class="fa-solid fa-sliders"></i> Capture Settings</h2>
                    <div class="options-group">
                        <label class="option-toggle">
                            <input type="checkbox" id="chkFrame" checked>
                            <span class="toggle-slider"></span>
                            <span class="toggle-label">Render Frame Outline</span>
                        </label>
                        <label class="option-toggle">
                            <input type="checkbox" id="chkEffect" checked>
                            <span class="toggle-slider"></span>
                            <span class="toggle-label">Render Visual Effects</span>
                        </label>
                    </div>
                </div>

                <div class="panel-section">
                    <h2><i class="fa-solid fa-wand-magic-sparkles"></i> Visual Filter</h2>
                    <div class="filter-selector-grid" id="filterSelectorGrid">
                        <!-- Populated dynamically via JS -->
                    </div>
                    <p class="panel-tip"><i class="fa-solid fa-circle-info"></i> Gesture Tip: Touch index and thumb on <strong>both hands</strong> to cycle effects!</p>
                </div>

                <div class="panel-section recording-sec">
                    <h2><i class="fa-solid fa-video"></i> Session Recording</h2>
                    
                    <div class="rec-status-bar">
                        <span id="recEngine" class="rec-engine">WebCodecs (MP4)</span>
                        <span id="recTimer" class="rec-timer">00:00</span>
                    </div>

                    <button id="recordBtn" class="rec-button">
                        <span class="rec-icon"></span>
                        <span id="recordBtnText">Record Session</span>
                    </button>
                </div>
            </aside>
        </div>
    </main>

    <script src="./effect_rectangle.js"></script>
</body>
</html>
