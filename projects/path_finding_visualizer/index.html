<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathfinding Visualizer | Burak Karagol</title>
    <meta name="description" content="Interactive grid-based pathfinding visualizer comparing A*, Dijkstra, BFS, and DFS search algorithms." />
    <meta name="keywords" content="Pathfinding, A* Algorithm, Dijkstra, BFS, DFS, Graph Search, Grid, Visualization" />
    <meta name="author" content="Burak Karagol" />
    <meta name="theme-color" content="#0A1118" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://burakkaragol.github.io/projects/path_finding_visualizer/" />
    <meta property="og:title" content="Pathfinding Visualizer | Burak Karagol" />
    <meta property="og:description" content="Interactive grid-based pathfinding visualizer comparing A*, Dijkstra, BFS, and DFS search algorithms." />
    <meta property="og:image" content="https://burakkaragol.github.io/assets/img/projects/path_finding_algorithm_visualizer.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://burakkaragol.github.io/projects/path_finding_visualizer/" />
    <meta name="twitter:title" content="Pathfinding Visualizer | Burak Karagol" />
    <meta name="twitter:description" content="Interactive grid-based pathfinding visualizer comparing A*, Dijkstra, BFS, and DFS search algorithms." />
    <meta name="twitter:image" content="https://burakkaragol.github.io/assets/img/projects/path_finding_algorithm_visualizer.webp" />

    <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/img/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/apple-touch-icon.png" />

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="path_finding.css">
</head>
<body>
    <header>
        <h1>Pathfinding Visualizer</h1>
    </header>

    <main id="app-main">
        <section id="controls">
            <!-- Grid Controls -->
            <div class="button-group">
                <label for="grid-size">Grid Size:</label>
                <input type="number" id="grid-size" min="10" max="50" value="30">
                <button class="control-btn blue" onclick="generateGrid()">Generate Grid</button>
                <button class="control-btn blue" onclick="clearGrid()">Clear Grid</button>
                <button class="control-btn blue" onclick="resetGrid()">Reset Everything</button>
            </div>

            <!-- Mode Selection -->
            <div class="button-group">
                <label for="mode">Mode:</label>
                <button class="control-btn mode-btn" id="mode-start" onclick="setMode('start')">Place Start</button>
                <button class="control-btn mode-btn" id="mode-end" onclick="setMode('end')">Place End</button>
                <button class="control-btn mode-btn" id="mode-wall" onclick="setMode('wall')">Draw Walls</button>
                <button class="control-btn mode-btn" id="mode-erase" onclick="setMode('erase')">Erase</button>
            </div>

            <!-- Speed & Algorithm -->
            <div class="button-group">
                <label for="speed">Speed:</label>
                <input type="range" id="speed" min="10" max="100" value="50" step="5">
                <span id="speed-value">100ms</span>

                <label for="algorithm">Algorithm:</label>
                <select id="algorithm">
                    <option value="astar">A* Algorithm</option>
                    <option value="bfs">Breadth-First Search (BFS)</option>
                    <option value="dfs">Depth-First Search (DFS)</option>
                    <option value="dijkstra">Dijkstra's Algorithm</option>
                </select>

                <button class="control-btn green" onclick="runAlgorithm()">Start</button>
                <button class="control-btn white" onclick="stopAlgorithm()">Stop</button>
            </div>
        </section>

        <section id="grid-container"></section>
    </main>

    <script src="path_finding.js"></script>
  <script src="../tracker.js"></script>
</body>
</html>
