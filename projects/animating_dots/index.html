<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Animating Dots | Burak Karagol</title>
  <meta name="description" content="Interactive HTML5 canvas particle simulation with distance-based connections and mouse gravity physics." />
  <meta name="keywords" content="Particle Simulation, Canvas, Physics, Animation, JavaScript" />
  <meta name="author" content="Burak Karagol" />
  <meta name="theme-color" content="#0A1118" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://burakkaragol.github.io/projects/animating_dots/" />
  <meta property="og:title" content="Animating Dots | Burak Karagol" />
  <meta property="og:description" content="Interactive HTML5 canvas particle simulation with distance-based connections and mouse gravity physics." />
  <meta property="og:image" content="https://burakkaragol.github.io/assets/img/projects/animating_dots.webp" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://burakkaragol.github.io/projects/animating_dots/" />
  <meta name="twitter:title" content="Animating Dots | Burak Karagol" />
  <meta name="twitter:description" content="Interactive HTML5 canvas particle simulation with distance-based connections and mouse gravity physics." />
  <meta name="twitter:image" content="https://burakkaragol.github.io/assets/img/projects/animating_dots.webp" />

  <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/img/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/apple-touch-icon.png" />

  <link rel="stylesheet" href="dots.css" />
</head>
<body>
  <main id="app-main">
    <h1 class="visually-hidden">Animating Dots</h1>
    <div id="controls">
      <label>
        Point Count:
        <input type="range" id="pointCount" min="10" max="1000" value="300" />
        <span id="pointCountVal">300</span>
      </label>

      <label>
        Point Speed:
        <input type="range" id="pointSpeed" min="0.1" max="5" step="0.1" value="1" />
        <span id="pointSpeedVal">1</span>
      </label>

      <label>
        Wind X:
        <input type="range" id="windX" min="-15" max="15" step="1" value="0" />
        <span id="windXVal">0</span>
      </label>

      <label>
        Wind Y:
        <input type="range" id="windY" min="-15" max="15" step="1" value="0" />
        <span id="windYVal">0</span>
      </label>

      <label>
        Point Size:
        <input type="range" id="pointSize" min="1" max="100" step="1" value="3" />
        <span id="pointSizeVal">3</span>
      </label>

      <label>
        Point Opacity:
        <input type="range" id="pointOpacity" min="0" max="1" step="0.05" value="0.5" />
        <span id="pointOpacityVal">0.5</span>
      </label>

      <label>
        Line Distance:
        <input type="range" id="lineDistance" min="10" max="300" step="10" value="100" />
        <span id="lineDistanceVal">100</span>
      </label>

      <label>
        Line Thickness:
        <input type="range" id="lineThickness" min="0.1" max="5" step="0.1" value="1" />
        <span id="lineThicknessVal">1</span>
      </label>

      <label>
        Line Opacity:
        <input type="range" id="lineOpacity" min="0" max="1" step="0.05" value="0.5" />
        <span id="lineOpacityVal">0.5</span>
      </label>
      
      <label>
        Background Color:
        <input type="color" id="backgroundColor" value="#0a0a0a" />
      </label>
      
      <label>
        Dot Color:
        <input type="color" id="dotColor" value="#ffffff" />
      </label>
    
      <label>
        Line Color:
        <input type="color" id="lineColor" value="#ffffff" />
      </label>

      <button id="resetButton">Reset to Defaults</button>   
    </div>

    <button id="togglePanel">Hide Controls</button>

    <canvas id="dotCanvas"></canvas>
  </main>

  <script src="dots.js"></script>
  <script src="../tracker.js"></script>
</body>
</html>
