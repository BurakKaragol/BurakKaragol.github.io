<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>QR Code Generator | Burak Karagol</title>
    <meta name="description" content="Fast and customizable QR code generator supporting Wi-Fi, vCard, URLs, email, and high-resolution export." />
    <meta name="keywords" content="QR Code, Generator, SVG, PNG, Wi-Fi QR, vCard, Tools" />
    <meta name="author" content="Burak Karagol" />
    <meta name="theme-color" content="#0A1118" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://burakkaragol.github.io/projects/qr_code/" />
    <meta property="og:title" content="QR Code Generator | Burak Karagol" />
    <meta property="og:description" content="Fast and customizable QR code generator supporting Wi-Fi, vCard, URLs, email, and high-resolution export." />
    <meta property="og:image" content="https://burakkaragol.github.io/assets/img/projects/qr_code.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://burakkaragol.github.io/projects/qr_code/" />
    <meta name="twitter:title" content="QR Code Generator | Burak Karagol" />
    <meta name="twitter:description" content="Fast and customizable QR code generator supporting Wi-Fi, vCard, URLs, email, and high-resolution export." />
    <meta name="twitter:image" content="https://burakkaragol.github.io/assets/img/projects/qr_code.webp" />

    <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/img/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/apple-touch-icon.png" />

    <link rel="stylesheet" href="qr_code.css" />
  </head>
  <body>
    <div id="container">
      <!-- Left Panel: Controls -->
      <aside id="control-panel">
        <h1>QR Code Generator</h1>

        <label for="qr-type">QR Code Type:</label>
        <select id="qr-type">
          <option value="text">Text / URL</option>
          <option value="email">Email</option>
          <option value="phone">Phone</option>
          <option value="sms">SMS</option>
          <option value="wifi">Wi-Fi</option>
          <option value="vcard">vCard</option>
          <option value="event">Event</option>
        </select>
        
        <div id="content-fields"></div>      

        <label>Foreground Color:</label>
        <input type="color" id="fg-color" value="#000000" />

        <label>Background Color:</label>
        <input type="color" id="bg-color" value="#ffffff" />

        <label for="shape-style">Shape Style:</label>
        <select id="shape-style">
          <option value="square">Squares</option>
          <option value="classy">Classy</option>
          <option value="rounded">Rounded</option>
          <option value="extra-rounded">Extra Rounded</option>
          
        </select>

        <label for="size">Size:</label>
        <input type="number" id="size" value="512" min="128" max="1024" />

        <label for="error-correction">Error Correction:</label>
        <select id="error-correction">
          <option value="L">Low (L %7) </option>
          <option value="M" selected>Medium (M %15)</option>
          <option value="Q">Quartile (Q %25)</option>
          <option value="H">High (H %30)</option>
        </select>

        <button id="generate-btn">Generate QR</button>
        <button id="download-btn">Download PNG</button>
      </aside>

      <!-- Right Panel: QR Preview -->
      <main id="preview-panel">
        <div id="qr-canvas-container" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;"></div>
        <div id="qr-progress-bar-wrapper">
          <div id="qr-progress-bar"></div>
        </div> 
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script type="module" src="./qr_code.js"></script>  
  </body>
</html>
