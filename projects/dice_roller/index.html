<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dice Roller | Burak Karagol</title>
  <meta name="description" content="Polyhedral tabletop RPG dice roller with custom presets, statistics, and critical animations." />
  <meta name="keywords" content="Dice Roller, RPG, DnD, Tabletop, D20, RNG, Web App" />
  <meta name="author" content="Burak Karagol" />
  <meta name="theme-color" content="#0A1118" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://burakkaragol.github.io/projects/dice_roller/" />
  <meta property="og:title" content="Dice Roller | Burak Karagol" />
  <meta property="og:description" content="Polyhedral tabletop RPG dice roller with custom presets, statistics, and critical animations." />
  <meta property="og:image" content="https://burakkaragol.github.io/assets/img/projects/dice_roller.webp" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://burakkaragol.github.io/projects/dice_roller/" />
  <meta name="twitter:title" content="Dice Roller | Burak Karagol" />
  <meta name="twitter:description" content="Polyhedral tabletop RPG dice roller with custom presets, statistics, and critical animations." />
  <meta name="twitter:image" content="https://burakkaragol.github.io/assets/img/projects/dice_roller.webp" />

  <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/img/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/apple-touch-icon.png" />

  <link rel="stylesheet" href="dice.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div>
        <h1>Dice Roller</h1>
        <p>
          Press <span class="kbd">Space</span> or click <strong>Roll All</strong>
          to roll every die on the table.
        </p>
      </div>
      <div class="header-actions">
        <button id="clear-all-top-btn" class="secondary-btn">Clear</button>
        <button id="roll-all-btn" class="primary-btn">Roll All</button>
      </div>
    </header>

    <section class="controls">
      <div class="control-block control-block-add">
        <h2>Add Dice</h2>
        <div class="add-dice-buttons">
          <button class="add-die-btn" data-sides="4">d4</button>
          <button class="add-die-btn" data-sides="6">d6</button>
          <button class="add-die-btn" data-sides="8">d8</button>
          <button class="add-die-btn" data-sides="10">d10</button>
          <button class="add-die-btn" data-sides="12">d12</button>
          <button class="add-die-btn" data-sides="20">d20</button>
          <button class="add-die-btn" data-sides="100">d100</button>
        </div>
        <p class="hint-text">
          Click a die type to add one. Left-click a die to reroll it, right-click to delete it.
        </p>
      </div>

      <div class="control-block control-block-presets">
        <div class="presets-header">
          <h2>Presets</h2>
          <button id="clear-all-btn" class="text-btn">Clear all</button>
        </div>
        <div id="preset-row" class="preset-row">
          <!-- Preset cross-table generated via JS -->
        </div>
      </div>
    </section>

    <main class="dice-area">
      <!-- Total & stats bar BEFORE the dice grid -->
      <section class="summary">
        <div class="summary-main">
          <span class="summary-label">Total</span>
          <span id="total-sum" class="summary-value">0</span>
        </div>

        <div class="summary-metrics">
          <div class="metric-pill">
            <span class="metric-label">Highest</span>
            <span id="highest-value" class="metric-value">–</span>
          </div>
          <div class="metric-pill">
            <span class="metric-label">Lowest</span>
            <span id="lowest-value" class="metric-value">–</span>
          </div>
          <div class="metric-pill">
            <span class="metric-label">Average</span>
            <span id="average-value" class="metric-value">–</span>
          </div>
        </div>

        <div id="summary-detail" class="summary-detail">No dice yet.</div>
      </section>

      <div id="dice-grid" class="dice-grid">
        <!-- Dice cards injected here -->
      </div>
    </main>
  </div>

  <script src="dice.js"></script>
  <script src="../tracker.js"></script>
</body>
</html>
