<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Meshing Dots | Burak Karagol</title>
    <meta name="description" content="Interactive Delaunay triangulation mesh simulation with bilinear gradient color interpolation." />
    <meta name="keywords" content="Meshing Dots, Delaunay Triangulation, Canvas, Generative Mesh, JavaScript" />
    <meta name="author" content="Burak Karagol" />
    <meta name="theme-color" content="#0A1118" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://burakkaragol.github.io/projects/meshing_dots/" />
    <meta property="og:title" content="Meshing Dots | Burak Karagol" />
    <meta property="og:description" content="Interactive Delaunay triangulation mesh simulation with bilinear gradient color interpolation." />
    <meta property="og:image" content="https://burakkaragol.github.io/assets/img/projects/meshing_dots.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://burakkaragol.github.io/projects/meshing_dots/" />
    <meta name="twitter:title" content="Meshing Dots | Burak Karagol" />
    <meta name="twitter:description" content="Interactive Delaunay triangulation mesh simulation with bilinear gradient color interpolation." />
    <meta name="twitter:image" content="https://burakkaragol.github.io/assets/img/projects/meshing_dots.webp" />

    <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/img/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/apple-touch-icon.png" />

    <link rel="stylesheet" href="mesh.css" />
</head>
<body>
    <main id="app-main">
        <h1 class="visually-hidden">Meshing Dots</h1>
        <div id="controls-wrapper">
            <div id="controls">
                <label>
                    Point Count:
                    <input type="range" id="pointCount" min="10" max="500" value="100" />
                    <span id="pointCountVal">100</span>
                </label>

                <label>
                    Point Speed:
                    <input type="range" id="pointSpeed" min="0.1" max="5" step="0.1" value="1" />
                    <span id="pointSpeedVal">1</span>
                </label>

                <div id="colorGrid">
                    <div class="corner top-left">
                        <label>Top Left</label>
                        <input type="color" id="colorTopLeft" value="#ff0000" />
                    </div>

                    <div class="corner top-right">
                        <label>Top Right</label>
                        <input type="color" id="colorTopRight" value="#00ff00" />
                    </div>

                    <div class="corner bottom-left">
                        <label>Bottom Left</label>
                        <input type="color" id="colorBottomLeft" value="#0000ff" />
                    </div>

                    <div class="corner bottom-right">
                        <label>Bottom Right</label>
                        <input type="color" id="colorBottomRight" value="#ffff00" />
                    </div>
                </div>

                <label>
                    Point Color:
                    <input type="color" id="pointColor" value="#ffffff" />
                </label>

                <label>
                    Line Color:
                    <input type="color" id="lineColor" value="#000000" />
                </label>

                <label>
                    Mesh Opacity:
                    <input type="range" id="meshOpacity" min="0" max="1" step="0.05" value="0.5" />
                    <span id="meshOpacityVal">0.5</span>
                </label>

                <label>
                    Show Mesh:
                    <input type="checkbox" id="showMesh" checked />
                </label>

                <label>
                    Show Edges:
                    <input type="checkbox" id="showEdges" />
                </label>

                <button id="resetButton">Reset</button>
            </div>
            <button id="togglePanel">Hide Controls</button>
        </div>

        <canvas id="meshCanvas"></canvas>
    </main>

    <script src="https://unpkg.com/delaunator@5.0.0/delaunator.min.js"></script>
    <script src="mesh.js"></script>
</body>
</html>
